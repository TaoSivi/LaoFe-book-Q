<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAOFE — ຫຼັງບ້ານ (Admin)</title>
<meta name="theme-color" content="#4A1020">
<link rel="stylesheet" href="theme.css">
<style>
  .hide{display:none!important}
  .now{text-align:center;padding:8px 0 4px}
  .now .big{font-size:64px;font-weight:800;line-height:1.1;
    background:linear-gradient(90deg,var(--gold-1),var(--gold-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .now .lbl{font-size:13px;color:var(--cream-dim);letter-spacing:1px}
  .qrow{display:flex;align-items:center;gap:10px;padding:12px 12px;border-radius:14px;
    background:rgba(0,0,0,.2);border:1px solid rgba(231,201,135,.12);margin-top:10px}
  .qrow .qn{font-size:22px;font-weight:800;color:var(--gold-2);min-width:60px}
  .qrow .info{flex:1;min-width:0}
  .qrow .info .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qrow .info .meta{font-size:12px;color:var(--cream-dim)}
  .qrow .acts{display:flex;gap:6px;flex-shrink:0}
  .qrow.head{background:rgba(63,178,127,.12);border-color:rgba(63,178,127,.4)}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  .toolbar .btn{margin-top:0;flex:1;min-width:130px}
  .mini{padding:9px 12px;border-radius:11px;border:1px solid rgba(231,201,135,.3);background:rgba(0,0,0,.2);color:var(--cream);font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer}
  .mini.g{border-color:rgba(63,178,127,.5);color:#8fe3bd}
  .mini.r{border-color:rgba(224,106,106,.5);color:#f0a6a6}
  .row-actions{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark" id="logo"><div class="wordmark"><b>LAO<i>FE</i></b><span>CAFE &amp; BEER</span></div></div>
    <h1>ຫຼັງບ້ານ · ຈັດຄິວ</h1>
  </div>

  <!-- login -->
  <div id="viewLogin" class="card">
    <h2>ເຂົ້າສູ່ລະບົບ</h2>
    <label for="pin">ລະຫັດ PIN</label>
    <input id="pin" type="password" inputmode="numeric" placeholder="••••">
    <button class="btn" id="loginBtn">ເຂົ້າສູ່ລະບົບ</button>
    <div class="err" id="loginErr"></div>
  </div>

  <!-- dashboard -->
  <div id="viewAdmin" class="hide">
    <div class="card">
      <div class="now">
        <div class="lbl">ກຳລັງຮັບໃຊ້</div>
        <div class="big" id="nowServing">—</div>
      </div>
      <div class="toolbar">
        <button class="btn" id="nextBtn">➡️ ຮຽກຄິວຕໍ່ໄປ</button>
        <button class="btn ghost small" id="recallBtn" style="flex:0 0 auto">🔁 ຮຽກຊ້ຳ</button>
      </div>
      <div class="stats">
        <div class="stat"><div class="n" id="cWait">0</div><div class="t">ລໍຖ້າ</div></div>
        <div class="stat"><div class="n" id="cDone">0</div><div class="t">ຮັບແລ້ວ</div></div>
        <div class="stat"><div class="n" id="cTotal">0</div><div class="t">ທັງໝົດ</div></div>
      </div>
      <div class="err" id="aErr"></div>
    </div>

    <div class="card">
      <h2>ຄິວທີ່ລໍຖ້າ (<span id="waitCount">0</span>)</h2>
      <div id="list"><div class="notice">ຍັງບໍ່ມີຄິວ</div></div>
    </div>

    <div class="card">
      <div class="row-actions">
        <div style="font-size:13px;color:var(--cream-dim)">ອັບເດດອັດຕະໂນມັດ · <span id="clock">—</span></div>
        <button class="mini r" id="resetBtn">🧹 ລ້າງຄິວ/ເລີ່ມມື້ໃໝ່</button>
      </div>
    </div>
  </div>

  <div class="footer">LAOFE Cafe &amp; Beer · ຈັດຄິວຫຼັງບ້ານ</div>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
(function(){
  var C=window.LAOFE_CONFIG||{}; var POLL=C.POLL_MS||5000;
  var els=function(id){return document.getElementById(id);};
  var PIN=null, timer=null;

  (function(){var i=new Image();i.onload=function(){var m=els('logo');m.innerHTML='';m.appendChild(i);};i.src='logo.png';i.alt='LAOFE';})();

  function showErr(id,m){var e=els(id);e.textContent=m;e.style.display='block';}
  function hideErr(id){els(id).style.display='none';}

  els('loginBtn').onclick=async function(){
    hideErr('loginErr');
    var pin=els('pin').value.trim();
    if(!pin){showErr('loginErr','ໃສ່ລະຫັດ');return;}
    var b=this;b.disabled=true;b.innerHTML='<span class="spin"></span>';
    try{
      var r=await LAOFE_API.list(pin);
      if(!r||!r.ok){throw new Error((r&&r.error)||'ລະຫັດບໍ່ຖືກ');}
      PIN=pin;
      try{sessionStorage.setItem('laofe_pin',pin);}catch(e){}
      els('viewLogin').classList.add('hide');
      els('viewAdmin').classList.remove('hide');
      render(r); loop();
    }catch(err){ showErr('loginErr','ຜິດພາດ: '+err.message); }
    finally{ b.disabled=false; b.innerHTML='ເຂົ້າສູ່ລະບົບ'; }
  };

  function fmtTime(iso){ if(!iso)return''; try{var d=new Date(iso);return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}catch(e){return'';} }
  function waited(iso){ if(!iso)return''; try{var m=Math.round((Date.now()-new Date(iso).getTime())/60000);return m+' ນທ';}catch(e){return'';} }

  function render(r){
    els('nowServing').textContent = r.nowServing || '—';
    els('cWait').textContent = r.counts.waiting;
    els('cDone').textContent = r.counts.done;
    els('cTotal').textContent = r.counts.total;
    els('waitCount').textContent = r.counts.waiting;

    var list=els('list');
    var rows = (r.called||[]).concat(r.waiting||[]);
    if(rows.length===0){ list.innerHTML='<div class="notice">ຍັງບໍ່ມີຄິວ 🎉</div>'; return; }
    var html='';
    rows.forEach(function(q){
      var head = (q.status==='called');
      html+='<div class="qrow'+(head?' head':'')+'">'
        +'<div class="qn">'+q.ticket+'</div>'
        +'<div class="info"><div class="nm">'+esc(q.name)+(head?' 🔔':'')+'</div>'
        +'<div class="meta">👥 '+q.people+' · ⏱ '+waited(q.createdAt)+' · 📞 '+esc(q.phone||'-')+'</div></div>'
        +'<div class="acts">'
        +'<button class="mini g" data-call="'+q.ticket+'">ຮຽກ</button>'
        +'<button class="mini" data-done="'+q.ticket+'">✔</button>'
        +'<button class="mini r" data-skip="'+q.ticket+'">✕</button>'
        +'</div></div>';
    });
    list.innerHTML=html;
    list.querySelectorAll('[data-call]').forEach(function(b){b.onclick=function(){act('call',b.getAttribute('data-call'));};});
    list.querySelectorAll('[data-done]').forEach(function(b){b.onclick=function(){act('done',b.getAttribute('data-done'));};});
    list.querySelectorAll('[data-skip]').forEach(function(b){b.onclick=function(){if(confirm('ຂ້າມຄິວ '+b.getAttribute('data-skip')+'?'))act('skip',b.getAttribute('data-skip'));};});

    var d=new Date(); els('clock').textContent=d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')+':'+d.getSeconds().toString().padStart(2,'0');
  }
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  async function act(kind,ticket){
    try{
      var r;
      if(kind==='call') r=await LAOFE_API.call(PIN,ticket);
      else if(kind==='done') r=await LAOFE_API.done(PIN,ticket);
      else if(kind==='skip') r=await LAOFE_API.skip(PIN,ticket);
      await refresh();
    }catch(e){ showErr('aErr','ຜິດພາດ: '+e.message); }
  }

  els('nextBtn').onclick=async function(){ this.disabled=true; try{ await LAOFE_API.next(PIN); await refresh(); }catch(e){showErr('aErr',e.message);} this.disabled=false; };
  els('recallBtn').onclick=async function(){ try{ await LAOFE_API.recall(PIN); }catch(e){} };
  els('resetBtn').onclick=async function(){ if(!confirm('ລ້າງຄິວທັງໝົດ ແລະ ເລີ່ມນັບໃໝ່? (ຂໍ້ມູນເກົ່າຍັງຢູ່ໃນ Google Sheet)'))return; try{ await LAOFE_API.reset(PIN); await refresh(); }catch(e){showErr('aErr',e.message);} };

  async function refresh(){
    try{ var r=await LAOFE_API.list(PIN); if(r&&r.ok){hideErr('aErr');render(r);} }
    catch(e){ showErr('aErr','ກຳລັງລອງໃໝ່...'); }
  }
  function loop(){ refresh(); timer=setInterval(refresh, POLL); }

  // ຈື່ PIN ໃນ session
  try{ var saved=sessionStorage.getItem('laofe_pin'); if(saved){ els('pin').value=saved; } }catch(e){}
  if(!(window.LAOFE_API && LAOFE_API.configured())){ showErr('loginErr','⚠️ ຍັງບໍ່ໄດ້ຕັ້ງຄ່າ API_URL ໃນ config.js'); }
})();
</script>
</body>
</html>
