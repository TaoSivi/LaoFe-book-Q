<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAOFE — ປ້າຍ QR ຈອງຄິວ</title>
<link rel="stylesheet" href="theme.css">
<style>
  body{display:flex;flex-direction:column;align-items:center}
  .poster{
    width:min(92vw,420px); margin:18px auto; padding:34px 28px 30px;
    background:linear-gradient(170deg,var(--wine-3),var(--wine-1) 55%,var(--wine-2));
    border:2px solid rgba(231,201,135,.5); border-radius:28px; text-align:center;
    box-shadow:var(--shadow);
  }
  .poster .mark{width:120px;height:120px;margin:0 auto 10px}
  .poster h1{font-size:30px;margin:2px 0 0}
  .poster .sub{font-size:13px;letter-spacing:4px;color:var(--gold-2);margin-bottom:14px}
  .poster .cta{font-size:22px;font-weight:800;color:var(--cream);margin:6px 0 4px}
  .poster .cta2{font-size:15px;color:var(--cream-dim);margin-bottom:18px}
  .poster #qr{background:#fff;padding:16px;border-radius:20px;display:inline-block}
  .poster .steps{font-size:13px;color:var(--cream-dim);margin-top:16px;line-height:1.9;text-align:center}
  .poster .link{font-size:11px;color:rgba(246,239,221,.5);margin-top:12px;word-break:break-all}
  .print{max-width:420px}
  @media print{
    body{background:#fff}
    .print{display:none}
    .poster{box-shadow:none;border:2px solid #4A1020;background:#4A1020!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
  <div class="poster" id="poster">
    <div class="mark" id="logo" style="background:var(--cream);border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden">
      <div class="wordmark" style="display:flex;flex-direction:column;align-items:center;line-height:1">
        <b style="font-size:32px;font-weight:800;color:var(--wine-1)">LAO<i style="font-style:normal;color:var(--gold-1)">FE</i></b>
        <span style="font-size:9px;letter-spacing:2px;color:var(--wine-3)">CAFE &amp; BEER</span>
      </div>
    </div>
    <h1>LAO<em style="font-style:normal;background:linear-gradient(90deg,var(--gold-1),var(--gold-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">FE</em></h1>
    <div class="sub">CAFE &amp; BEER</div>
    <div class="cta">📱 ສະແກນເພື່ອຈອງຄິວ</div>
    <div class="cta2">Scan to book your queue</div>
    <div id="qr"></div>
    <div class="steps">① ສະແກນ QR &nbsp; ② ໃສ່ຊື່ · ເບີໂທ · ຈຳນວນຄົນ<br>③ ຮັບເລກຄິວ &nbsp; ④ ລໍສຽງເຕືອນເມື່ອຮອດຄິວ</div>
    <div class="link" id="link"></div>
  </div>

  <div class="print wrap">
    <button class="btn" onclick="window.print()">🖨️ ພິມ / ບັນທຶກ PDF</button>
    <div class="notice">ພິມໃສ່ເຈ້ຍ ຫຼື ບັນທຶກເປັນ PDF ແລ້ວວາງໄວ້ໜ້າຮ້ານ / ໂຕະ</div>
  </div>

<script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs@04f46c6a/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
  (function(){var i=new Image();i.onload=function(){var m=document.getElementById('logo');m.innerHTML='';i.style.width='100%';i.style.height='100%';i.style.objectFit='cover';m.appendChild(i);};i.src='logo.png';})();
  var link = location.origin + location.pathname.replace(/poster\.html$/,'index.html');
  if(link.endsWith('/')) link += 'index.html';
  document.getElementById('link').textContent = link;
  try{ new QRCode(document.getElementById('qr'),{text:link,width:230,height:230,colorDark:'#4A1020',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); }
  catch(e){ document.getElementById('qr').textContent = link; }
})();
</script>
</body>
</html>
